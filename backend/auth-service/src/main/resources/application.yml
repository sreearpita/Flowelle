server:
  port: 8081
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowelle}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.flowelle: DEBUG

jwt:
  secret: 0cb661660f45f6bd78dc82efa01a3c2c21ac8f4c3518ed53c8000c0f30766b39
  expiration: 86400000 # 24 hours in milliseconds

cycles:
  service:
    url: http://localhost:8082

aif:
  callback:
    key-id: ${AIF_CALLBACK_KEY_ID:dev-v1}
    secret: ${AIF_CALLBACK_SECRET:dev-aif-tool-secret}
  proxy:
    url: ${AIFRIEND_URL:}
    tenant-key: ${AIFRIEND_TENANT_KEY:}
  user-context:
    issuer: ${AIF_USER_CONTEXT_ISSUER:flowelle}
    audience: ${AIF_USER_CONTEXT_AUDIENCE:ai-friend-chat}
    tenant: ${AIF_USER_CONTEXT_TENANT:flowelle}
    key-id: ${AIF_USER_CONTEXT_KEY_ID:flowelle-aif-v1}
    lifetime-seconds: ${AIF_USER_CONTEXT_LIFETIME_SECONDS:60}
    private-key-base64: ${AIF_USER_CONTEXT_PRIVATE_KEY_BASE64:}

openai:
  api-key: ${OPENAI_API_KEY:}
  realtime:
    model: ${OPENAI_REALTIME_MODEL:gpt-realtime-2}
    transcription-model: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
